    AdminOverview:
      description: |
        管理控制台首页聚合（第十七篇 §5.3 四层结构）。
        每个数字都必须能说明统计范围与数据来源，故 detail/口径由服务端一并给出。
      type: object
      required: [counts, system_health, business, semantic, governance]
      properties:
        counts:
          type: object
          properties:
            roles: { type: integer }
            role_bindings: { type: integer }
            policy_versions: { type: integer }
            agents: { type: integer }
            tools: { type: integer }
            ontologies: { type: integer }
            active_installations: { type: integer }
            evaluation_runs: { type: integer }
            audit_events: { type: integer }
        platform_users: { type: integer }
        generated_at: { type: string, format: date-time }
        system_health:
          type: array
          items:
            type: object
            required: [component, state]
            properties:
              component: { type: string }
              state: { type: string, enum: [healthy, degraded, down] }
              detail: { type: string }
        business:
          type: object
          properties:
            total_runs: { type: integer }
            success_rate:
              type: number
              format: float
              description: COMPLETED / 终态 Run；无终态 Run 时为 0
            failures: { type: integer }
            pending_approvals: { type: integer }
            pending_reconciliations: { type: integer }
        semantic:
          type: object
          properties:
            ontology_validation_failures: { type: integer }
