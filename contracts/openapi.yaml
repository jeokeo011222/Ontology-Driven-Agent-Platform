          description: 供应商与端点
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelProviders" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [BFF]
      summary: 新建模型供应商（含首个端点）
      description: |
        在**单事务**内创建供应商与其**首个端点**。为什么不能只建供应商：
        llm.providers 本身不含地址与凭据，只有端点带 base_url / credential_ref 才可能
        被 Model Registry 装配（第九篇 §4.4；internal/llm/registry.go 对 HTTP 端点缺
        base_url 或缺 credential_ref 一律 fail-closed），只建供应商会留下**永远无法
        被调用**的空壳，因此 endpoint 为必填。

        **凭据安全（§8.2 / §13.2）**：HTTP 端点的凭据来源二选一 ——
        ① `credential_ref`（秘密存储中的**引用名**，如 ODAP_LLM_API_KEY；凭据仍只在进程环境里）；
        ② `api_key`（界面录入的**明文密钥**，只入不出）。服务端对 `api_key` 用
        AES-256-GCM 信封加密后落库（llm.endpoints.credential_ciphertext），响应与审计
        **绝不回显明文**：对外只给 `credential_source`（CIPHERTEXT / ENV_REF / NONE）、
        `credential_masked`（如 sk-****6e22）与 `has_credential`。未配置主密钥
        （ODAP_SECRET_MASTER_KEY）且走 `api_key` 路径时 fail-closed 返回 503。

        `provider_id` 缺省时由 `display_name` 派生（小写、非 [a-z0-9] 归一为 '-'）；
        `provider_id` 是 llm.providers 的主键（TEXT），重复返回 409 CONFLICT。
      operationId: createModelProvider
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateModelProviderRequest" }
      responses:
        "201":
          description: 已创建（返回供应商与端点标识）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedModelProvider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/admin/model-providers/probe:
    post:
      tags: [BFF]
      summary: 录入前连通性探测（真实试调一次）
      description: |
        用**请求体中刚填的参数**对模型端点真实试调一次，用于录入窗口的「测试连接」。

        **无副作用边界**：不落库、不写用量账本（账本是业务推理的对账真值，探测会污染它）；
        审计只记录 deployment_type / 目标主机（去 userinfo 与查询串）/ 结果，**绝不含密钥**。
        应用户反复调整参数重复调用，故**不读 Idempotency-Key**（探测本身无写副作用，天然幂等）。

        `api_key` 允许随请求携带（只入不出，用于本次探测）；`credential_ref` 则按引用名从
        进程环境解析。二者对 HTTP 端点二选一。探测失败以 `probe.ok=false` 返回具体诊断，
        而非 5xx（配置填错是预期内的诊断结果，不是系统故障）。
      operationId: probeModelProvider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProbeModelProviderRequest" }
      responses:
        "200":
          description: 探测结果（成功与否均在体内表达）
          content:
            application/json:
              schema:
                type: object
                required: [probe]
                properties:
                  probe: { $ref: "#/components/schemas/ProbeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/model-providers/{id}:
    get:
      tags: [BFF]
      summary: 查询模型供应商详情（含端点）
      operationId: getModelProvider
      parameters:
        - name: id
          in: path
          required: true
          description: provider_id（llm.providers 的 TEXT 主键）
          schema: { type: string }
      responses:
        "200": { description: 供应商详情 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [BFF]
      summary: 更新模型供应商元数据（display_name / status）
      operationId: updateModelProvider
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
                status: { type: string, enum: [ACTIVE, DISABLED] }
      responses:
        "200": { description: 已更新 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [BFF]
      summary: 删除模型供应商（单事务级联名下端点，物理删除）
      operationId: deleteModelProvider
      description: |
        下游保护：若名下端点被 llm.model_revisions 或 llm.usage_ledger 引用
        （审计链），返回 409 并提示改为停用（PATCH status=DISABLED）；
        否则在单事务内先删名下端点、再删供应商。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: 已删除 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/model-providers/{id}/endpoints:
    post:
      tags: [BFF]
      summary: 给已有模型供应商新增端点
      operationId: addModelEndpoint
      parameters:
        - name: id
          in: path
          required: true
          description: provider_id（llm.providers 的 TEXT 主键）
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint_name, deployment_type]
              properties:
                endpoint_name:
                  type: string
                  description: 端点名（如 acme-default）
                deployment_type:
                  type: string
                  enum: [HTTP]
                  description: 仅支持 HTTP（MOCK 部署形态已下线）
                region_code:
                  type: string
                base_url:
                  type: string
                  description: HTTP 端点必填，须以 http(s):// 开头
                credential_ref:
                  type: string
                  description: 秘密存储中的引用名（如 ODAP_LLM_API_KEY）；与 api_key 二选一
                api_key:
                  type: string
                  description: |
                    明文密钥（**只入不出**）：与 credential_ref 二选一对立。
                    服务端 AES-256-GCM 加密落库，响应只回 credential_masked / credential_source。
                status:
                  type: string
                  enum: [ACTIVE, DISABLED]
                  default: ACTIVE
      responses:
        "201": { description: 已创建端点（返回 endpoint_id） }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/model-endpoints/{endpoint_id}:
    patch:
      tags: [BFF]
      summary: 白名单更新模型端点
      operationId: updateModelEndpoint
      parameters:
        - name: endpoint_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "至少提供一个字段；deployment_type 改动时须同时补齐对应网络字段"
              properties:
                endpoint_name: { type: string }
                deployment_type: { type: string, enum: [HTTP], description: 仅支持 HTTP（MOCK 已下线） }
                region_code: { type: string }
                base_url: { type: string }
                credential_ref: { type: string }
                api_key:
                  type: string
                  nullable: true
                  description: |
                    明文密钥（只入不出），**三态**：
                    省略 = 不改动现有密钥；非空 = 替换为新的密文凭据；显式空串 = 清空密文凭据
                    （此后 HTTP 端点必须保留非空 credential_ref，否则 400）。
                    与 credential_ref 不可同时提供。
                status: { type: string, enum: [ACTIVE, DISABLED] }
      responses:
        "200": { description: 已更新 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [BFF]
      summary: 删除模型端点（带下游保护）
      operationId: deleteModelEndpoint
      description: |
        删除保护：① 无 llm.model_revisions 引用；② 无 llm.usage_ledger 账本引用
        （账本是审计真值不可硬删）。任一命中返回 409 Conflict 并附具体原因。
        （不再限制"供应商必须剩余其他端点"：零端点供应商会被装配期忽略，无需此约束。）
      parameters:
        - name: endpoint_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: 已删除 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/model-endpoints/{endpoint_id}/models:
    get:
      tags: [BFF]
      summary: 列出端点已登记的模型版本
      description: |
        列出该端点下的 llm.model_revisions（连同其内容寻址的能力档案 llm.capability_profiles）。
        空列表表示尚未登记任何模型版本 —— 此时端点在装配期被排除（原因"该端点尚未登记任何
        模型版本"），自动生成端点会以「模型网关未装配」fail-closed 拒绝，而非静默返回假结果。
      operationId: listModelRevisions
      parameters:
        - name: endpoint_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 该端点的模型版本列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelRevisionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [BFF]
      summary: 登记模型版本（写能力档案 + 模型版本）
      description: |
        一次登记同时写入**内容寻址的能力档案**（llm.capability_profiles）与**模型版本**
        （llm.model_revisions）。这是让端点真正参与路由、自动生成可用的唯一路径：二者
        缺一，端点都会被装配期排除。

        能力档案主键 = 规范化 `capabilities` 的 SHA-256，由服务端计算，`capabilities`
        字段名拼错会被直接拒绝（不静默取零值）。`max_context_tokens` 必须为正整数，否则
        该模型会在装配期被排除。

        同 `(endpoint_id, model_id, revision_label)` 重复登记走更新（并置回 ACTIVE），
        不会新增重复行。
      operationId: registerModelRevision
      parameters:
        - name: endpoint_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterModelRevisionRequest" }
      responses:
        "201":
          description: 已登记
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisteredModelRevision" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/admin/model-endpoints/{endpoint_id}/models/{model_revision_id}:
    delete:
      tags: [BFF]
      summary: 删除模型版本登记（带下游保护）
      description: |
        删除保护：该 model_revision_id 已被 llm.usage_ledger 引用（即已产生真实调用账本）时
        返回 409 Conflict —— 账本是审计真值，不能因删除登记行而指向不存在的版本。
        归属校验：登记必须属于路径上的端点，否则 404。
      operationId: deleteModelRevision
      parameters:
        - name: endpoint_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: model_revision_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: 已删除 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/role-bindings/{id}:
    delete:
      tags: [Admin]
      summary: 解除角色绑定
      operationId: adminUnbindRole
