    get:
      tags: [Tasks]
      summary: 异步任务状态（带退避轮询）
      description: |
        异步任务在数据模型上不单独建表，任务引用指向其承载资源：任务 ID = run_id，
        kind = RUN，state 由 Run 状态派生（contracts/01 §5.1：任务终态不得翻译为
        "业务已成功"）。
      operationId: getTask
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: 任务状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/stream:
    get:
      tags: [Stream]
      summary: 统一实时通道（SSE）
      description: |
        服务端事件流（text/event-stream）。

        - 按租户过滤事件；
        - 支持 Last-Event-ID 续传（请求头 `Last-Event-ID` 或查询参数
          `last_event_id`；`_` 表示从头回放当前有界缓冲）；
        - 事件分级 CRITICAL / IMPORTANT / NORMAL：背压时只丢弃 NORMAL，
          CRITICAL/IMPORTANT 在订阅者过慢时强制断开（客户端携带
          Last-Event-ID 重连补齐）；
        - 15s 心跳注释（`: heartbeat`）；
        - 每条事件的 data 为 `{"criticality":"<级别>","payload":<事件载荷>}`。
      operationId: streamEvents
      parameters:
        - name: last_event_id
          in: query
          required: false
          schema: { type: string }
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: 事件流
          content:
            text/event-stream:
              schema:
                type: string
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

