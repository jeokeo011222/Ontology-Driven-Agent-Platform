openapi: 3.1.0
info:
  title: ODAP Platform API
  version: 1.0.0
  description: |
    ODAP 企业本体驱动智能体平台对外 HTTP 契约（唯一机器可读真源）。

    权威来源：
    - docs/contracts/01-全局状态注册表.md（Run 17 状态）
    - docs/contracts/02-统一错误码注册表.md（12 基础码 + 域码 + 错误响应结构 §4）
    - docs/contracts/03-API命名与契约规范.md（端点总表 §2、cursor 分页 §1.4、
      Idempotency-Key §1.6、异步任务 §1.8、SSE §1.9）
    - docs/第十七篇 §11.1（BFF 聚合端点）

    本文件与 contracts/03 冲突时以本文件为准，并回修 contracts/03（契约规范 §1.10）。
  license:
    name: Proprietary
servers:
  - url: /
    description: 当前部署（路径已含 /api/v1 前缀）

tags:
  - name: Runs
    description: 执行资源（唯一执行资源 agent_runs）
  - name: Agents
  - name: Ontologies
  - name: Plugins
  - name: Tools
  - name: Skills
    description: Skill Registry（技能作为一等 registry 资源，Agent 经 dependency_manifest.skills 依赖）
  - name: Policies
  - name: Approvals
  - name: ERP
  - name: Audit
  - name: Evaluations
  - name: PlanTemplates
  - name: Tasks
  - name: Stream
  - name: BFF
  - name: Health

security:
  - bearerAuth: []
  - sessionCookie: []

paths:
  /healthz:
    get:
      tags: [Health]
      summary: 存活探针（不要求认证）
      security: []
      operationId: healthz
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version, time]
                properties:
                  status: { type: string, enum: [ok] }
                  service: { type: string }
                  version: { type: string }
                  time: { type: string, format: date-time }

  /readyz:
    get:
      tags: [Health]
      summary: 就绪探针（探测数据库；未配置探针返回 503）
      security: []
      operationId: readyz
      responses:
        "200":
          description: 依赖就绪
          content:
            application/json:
              schema:
                type: object
                required: [status, checks]
                properties:
                  status: { type: string, enum: [ok] }
                  checks:
                    type: object
                    additionalProperties: { type: string }
        "503":
          description: 依赖不可用或探针未配置
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [unavailable] }
                  checks:
                    type: object
                    additionalProperties: { type: string }

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: 基于组织注册新用户
      operationId: authRegister
      description: |
        用户提供 org_code → 系统定位租户 → 创建 user + credentials (bcrypt) + membership
        → 自动签发首个会话令牌。org_code 必须由管理员预先创建。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_code, login_name, display_name, password]
              properties:
                org_code:     { type: string, minLength: 1 }
                login_name:   { type: string, minLength: 3 }
                display_name: { type: string }
                email:        { type: string, format: email }
                password:     { type: string, minLength: 6 }
      responses:
        "201":
          description: 注册成功 + 会话令牌
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 密码登录
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_name, password]
              properties:
                login_name: { type: string }
                password:   { type: string }
      responses:
        "200":
          description: 登录成功 + 会话令牌
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: 注销（撤销当前会话）
      operationId: authLogout
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: 已注销 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/session:
    get:
      tags: [Auth]
      summary: 获取当前会话投影（用户信息 + 权限数组）
      description: |
        前端启动时调用一次（或 Bearer token 刷新后），拿到当前会话对应的
        用户基本信息、租户信息、组织路径和权限键数组，用于初始化 SessionContext。
        无 token / 会话已过期 → 401。
      operationId: authSession
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 会话投影
          content:
            application/json:
              schema:
                type: object
                required: [subject_id, login_name, display_name, tenant_id, tenant_name, org_path, permissions]
                properties:
                  subject_id:    { type: string, description: "用户 UUID" }
                  login_name:    { type: string }
                  display_name:  { type: string }
                  email:         { type: string }
                  tenant_id:     { type: string }
                  tenant_name:   { type: string }
                  org_path:      { type: string, description: "组织路径，如 财务部/费用组" }
                  permissions:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/runs:
    get:
      tags: [Runs]
      summary: 查询 Run 列表
      operationId: listRuns
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RunStatus"
        - name: created_after
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: created_before
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Run 分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [Runs]
      summary: 创建 Run
      operationId: createRun
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "201":
          description: 已创建（初始状态 CREATED）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/runs/{id}:
    get:
      tags: [Runs]
      summary: 查询 Run 状态、步骤与版本锁依赖
      operationId: getRun
      parameters:
        - $ref: "#/components/parameters/RunIdPath"
      responses:
        "200":
          description: Run 详情
          content:
            application/json:
              schema:
                type: object
                required: [run, steps, dependencies]
                properties:
                  run: { $ref: "#/components/schemas/Run" }
                  steps:
                    type: array
                    items: { $ref: "#/components/schemas/RunStep" }
                  dependencies:
                    type: array
                    items: { $ref: "#/components/schemas/RunDependency" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/runs/{id}/steps:
    get:
      tags: [Runs]
      summary: 查询 Run 的执行步骤（本体审查的按本体处理过程）
      operationId: listRunSteps
      parameters:
        - $ref: "#/components/parameters/RunIdPath"
      responses:
        "200":
          description: 步骤列表（按 step_no 升序）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunStepList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/runs/{id}/cancel:
    post:
      tags: [Runs]
      summary: 请求取消 Run（统一入口，进入 CANCELLING）
      operationId: cancelRun
      parameters:
        - $ref: "#/components/parameters/RunIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "202":
          description: 取消已受理（进入 CANCELLING，在途外部操作由取消收敛队列处理）
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string, format: uuid }
                  status: { $ref: "#/components/schemas/RunStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/runs/{id}/reconcile:
    post:
      tags: [Runs]
      summary: Run 级批量对账编排（异步）
      operationId: reconcileRun
      parameters:
        - $ref: "#/components/parameters/RunIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: 对账任务已入队
          content:
            application/json:
              schema:
                type: object
                required: [task_id, kind, status, status_url]
                properties:
                  task_id: { type: string }
                  kind: { type: string, enum: [RUN_RECONCILIATION] }
                  status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED] }
                  status_url: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/runs/{id}/lease/renew:
    post:
      tags: [Runs]
      summary: Worker 租约续期（内部端点语义，需携带 owner+epoch）
      operationId: renewRunLease
      parameters:
        - $ref: "#/components/parameters/RunIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewLeaseRequest"
      responses:
        "200":
          description: 续期成功
          content:
            application/json:
              schema:
                type: object
                required: [run_id, lease_owner, lease_epoch, lease_expires_at]
                properties:
                  run_id: { type: string, format: uuid }
                  lease_owner: { type: string }
                  lease_epoch: { type: integer, format: int64 }
                  lease_expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/agents:
    get:
      tags: [Agents]
      summary: 查询 Agent 列表
      operationId: listAgents
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          required: false
          description: 状态筛选（ACTIVE/DISABLED/DELETED）
          schema: { type: string }
        - name: q
          in: query
          required: false
          description: 关键字检索（agent_key / 名称 / 业务域）
          schema: { type: string }
      responses:
        "200":
          description: Agent 列表
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Agent" }
                  next_cursor: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [Agents]
      summary: 创建 Agent（含首个 DRAFT 版本）
      operationId: createAgent
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedResource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/agents/generate:
    post:
      tags: [Agents]
      summary: 由需求/制度文档自动生成 Agent 定义（大模型 → DRAFT）
      description: |
        依据自然语言需求（instructions）与/或制度文档（source_path），调用已装配的
        真实 HTTP 模型端点生成 Agent 定义（输入/输出 Schema、提示词、依赖工具），
        落库为首个 DRAFT 版本。模型网关未装配或输出不合法时明确失败，绝不返回假结果。
      operationId: generateAgent
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instructions: { type: string, description: 自然语言需求 }
                source_path: { type: string, description: 相对制度文档根目录的路径 }
                agent_key: { type: string }
                domain: { type: string }
                model_id: { type: string }
                max_source_chars: { type: integer }
      responses:
        "201":
          description: 已生成并落库为 DRAFT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedResource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/agents/{id}:
    get:
      tags: [Agents]
      summary: 查询 Agent 详情（含最新版本）
      operationId: getAgent
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: Agent 详情 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Agents]
      summary: 更新 Agent 元数据（agent_key 不可变）
      operationId: updateAgent
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string }
                domain: { type: string }
      responses:
        "200": { description: 已更新 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Agents]
      summary: 删除 Agent（软删除，status → DELETED）
      operationId: deleteAgent
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: 已删除 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/agents/{id}/publish:
    post:
      tags: [Agents]
      summary: 发布 Agent 最新版本
      operationId: publishAgent
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: string }
      responses:
        "200":
          description: 已发布
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id: { type: string, format: uuid }
                  version_id: { type: string, format: uuid }
                  status: { type: string, enum: [PUBLISHED] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/ontologies:
    get:
      tags: [Ontologies]
      summary: 查询本体列表
      operationId: listOntologies
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          required: false
          description: 状态筛选（ACTIVE/INACTIVE/ARCHIVED；软删除条目始终排除）
          schema: { type: string }
        - name: q
          in: query
          required: false
          description: 关键字检索（本体键 / 名称）
          schema: { type: string }
      responses:
        "200":
          description: 本体列表
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Ontology" }
                  next_cursor: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [Ontologies]
      summary: 创建本体（含首个 DRAFT 版本）
      operationId: createOntology
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOntologyRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedResource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/ontologies/generate:
    post:
      tags: [Ontologies]
      summary: 由制度文档自动生成本体（大模型 → DRAFT）
      description: |
        读取制度文档，抽取正文后调用已装配的真实 HTTP 模型端点生成结构化本体清单，
        落库为首个 DRAFT 版本。模型网关未装配、文档不可解析、模型输出不满足结构约束时
        一律明确失败（503/422），绝不返回假成功或占位内容。

        请求体支持两种形式，**二者二选一**；同时提供或都不提供一律 400：
        - `multipart/form-data`：字段 `file`，从本地选择制度文档（.docx/.doc/.xlsx/.md）；
        - `application/json`：字段 `source_path`，相对制度文档根目录（默认 docs/资料）的路径。

        两者都允许附加相同的生成参数（ontology_key/name/domain/granularity/description/
        category_id/model_id/max_source_chars）。
      operationId: generateOntology
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary, description: "本地制度文档（.docx/.doc/.xlsx/.md）；与 source_path 二选一" }
                ontology_key: { type: string }
                name: { type: string }
                domain: { type: string, description: "业务领域；token 恒等于所选业务领域分类的 category_code" }
                granularity: { type: string, description: "如 DOMAIN/ENTITY" }
                description: { type: string }
                category_id: { type: string, format: uuid }
