    ModelProvider:
      type: object
      properties:
        provider_id: { type: string }
        display_name: { type: string }
        provider_type: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }

    ModelEndpoint:
      type: object
      properties:
        endpoint_id: { type: string, format: uuid }
        provider_id: { type: string }
        endpoint_name: { type: string }
        deployment_type: { type: string }
        region_code: { type: string, nullable: true }
        base_url: { type: string, nullable: true }
        credential_source:
          type: string
          enum: [CIPHERTEXT, ENV_REF, NONE]
          description: 凭据来源枚举。CIPHERTEXT=界面录入并加密落库；ENV_REF=环境变量引用；NONE=无凭据
        credential_masked:
          type: string
          description: 打码后的凭据（如 sk-****6e22）；永不回显明文
        has_credential:
          type: boolean
          description: 是否已配置凭据（不含任何明文信息）
        model_ids:
          type: string
          description: 该端点已登记的模型版本（逗号分隔）；为空表示"尚无模型版本，不参与路由"
        status: { type: string }
        created_at: { type: string, format: date-time }

    CreateModelProviderRequest:
      type: object
      required: [display_name, provider_type, endpoint]
      properties:
        provider_id:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          minLength: 2
          maxLength: 63
          description: |
            可选。留空则由 display_name 派生（大写转小写，安全分隔符折叠为单个 '-'）。
            **派生只在无损映射时成立**：显示名含中文、重音字母、emoji 等不可映射字符时，
            服务端拒绝隐式派生并返回 400，此时必须显式提供本字段。
            该形状同时是 /api/v1/admin/model-providers/{id}/verify 的路径参数，故强制 URL 安全；
            显式提供时执行同一校验，不允许 '/'、'..'、空格等。
        display_name: { type: string }
        provider_type: { type: string, enum: [OPENAI_COMPATIBLE], description: 仅支持 OPENAI_COMPATIBLE（MOCK 已下线） }
        status: { type: string, enum: [ACTIVE, DISABLED], default: ACTIVE }
        endpoint:
          type: object
          description: 首个端点（必填；地址与凭据引用都在端点上）
          required: [endpoint_name, deployment_type]
          properties:
            endpoint_name: { type: string }
            deployment_type:
              type: string
              enum: [HTTP]
              description: 仅支持 HTTP（真实网络调用）；MOCK 进程内确定性模拟形态已下线
            region_code: { type: string, nullable: true }
            base_url:
              type: string
              nullable: true
              description: deployment_type=HTTP 时必填，须以 http:// 或 https:// 开头
            credential_ref:
              type: string
              nullable: true
              description: |
                秘密存储中的**引用名**（如 ODAP_LLM_API_KEY），不是密钥本身。
                与 api_key 二选一（HTTP 端点至少一个）。二者同时提供返回 400。
            api_key:
              type: string
              nullable: true
              description: |
                明文密钥（**只入不出**）：与 credential_ref 二选一。
                服务端 AES-256-GCM 信封加密落库，响应与审计绝不回显明文；
                未配置 ODAP_SECRET_MASTER_KEY 时该路径 fail-closed 返回 503。
            status: { type: string, enum: [ACTIVE, DISABLED], default: ACTIVE }

    CreatedModelProvider:
      type: object
      description: 新建成功响应。provider_id 为 TEXT 主键（非 uuid），故不使用通用 CreatedResource。
      required: [provider_id, endpoint_id]
      properties:
        provider_id: { type: string }
        endpoint_id: { type: string, format: uuid }
        endpoint_name: { type: string }
        status: { type: string }
        credential_source: { type: string, enum: [CIPHERTEXT, ENV_REF, NONE] }
        credential_masked: { type: string, description: 打码后的凭据；永不回显明文 }
        has_credential: { type: boolean }

    ProbeModelProviderRequest:
      type: object
      required: [deployment_type]
      properties:
        deployment_type:
          type: string
          enum: [HTTP]
          description: 仅支持 HTTP；缺省视为 HTTP。MOCK 已下线，传入即返回 400
        base_url:
          type: string
          description: HTTP 探测必填，须以 http:// 或 https:// 开头
        credential_ref:
          type: string
          description: 环境变量引用名；与 api_key 二选一（HTTP 探测至少一个）
        api_key:
          type: string
          description: 明文密钥（只入不出），仅用于本次探测解析不落库
        model_id:
          type: string
          description: |
            探测用模型名。缺省时退化为 GET {base_url}/models，仅验证鉴权与寻址，
            不消耗推理配额。指定时调用一次聊天补全（max_tokens=1）以验证模型可用。
        endpoint_id:
          type: string
          format: uuid
          description: |
            指名一个已落库的端点。当请求未提供 api_key / credential_ref 时，
            服务端改用该端点已存凭据（密文优先，解密失败不回落）与地址探测——
            供「编辑接入」弹窗的「模型测试」使用，无需重新粘贴明文密钥。
            同时提供凭据时以请求中的凭据为准。

    ProbeResult:
      type: object
      required: [ok, latency_ms, message]
      properties:
        ok: { type: boolean }
        latency_ms: { type: integer, format: int64 }
        status_code: { type: integer, description: 供应商返回的 HTTP 状态码（网络失败时为 0） }
        error_code: { type: string, description: 已登记错误码；成功时省略 }
        message: { type: string, description: 面向用户的可执行诊断 }
        vendor_error_snippet:
          type: string
          description: 供应商错误回显（已二次脱敏并截断至 200 字符）
        preview:
          type: string
          description: 成功时的模型输出预览（截断至 200 字符）

    RegisterModelRevisionRequest:
      type: object
      required: [model_id, capability_revision, capabilities]
      properties:
        model_id:
          type: string
          description: 模型标识（如 deepseek-chat）。llm.model_revisions.model_id。
        revision_label:
          type: string
          description: 模型版本修订标识（可空）。与 endpoint_id + model_id 一起构成重复登记的判定键。
        capability_revision:
          type: string
          description: 能力档案的修订标识；llm.capability_profiles.revision 为 NOT NULL，故必填。
        capability_verified:
          type: boolean
          description: |
            能力是否已经验证。true → 档案落 VERIFIED 并记录验证时间；false（缺省）→ 落 UNVERIFIED。
            两种状态都参与路由，区别只是 UNVERIFIED 会在装配诊断里留痕说明能力未经探测验证。
        capabilities:
          $ref: "#/components/schemas/ModelCapabilities"

    ModelCapabilities:
      type: object
      required: [max_context_tokens]
      description: |
        能力声明（snake_case，与 llm.capability_profiles.capabilities 落库字段一致）。
        未知字段会被直接拒绝：字段名拼错会让该能力静默取零值，从而改变路由与结构化输出行为。
      properties:
        native_schema:
          type: boolean
          description: 是否原生支持严格 Schema 约束生成；false 表示只能自由生成后本地校验
        supports_seed:
          type: boolean
          description: 是否支持确定性 seed（仅在请求带 seed 时作为硬约束）
        supports_tools:
          type: boolean
          description: 是否支持工具调用（仅在请求带 工具 时作为硬约束）
        max_context_tokens:
          type: integer
          description: 最大上下文 tokens；必须为正整数，为 0 会导致该模型在装配期被排除

    ModelRevision:
      type: object
      required: [model_revision_id, endpoint_id, model_id, capability_digest, status]
      properties:
        model_revision_id: { type: string, format: uuid }
        endpoint_id: { type: string, format: uuid }
        model_id: { type: string }
        revision_label: { type: string, description: 可空；空串表示无修订标识 }
        capability_digest:
          type: string
          description: 内容寻址的能力档案主键（规范化 capabilities 的 SHA-256）
        capability_revision: { type: string }
        capability_status: { type: string, enum: [VERIFIED, UNVERIFIED, REVOKED] }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        capabilities: { $ref: "#/components/schemas/ModelCapabilities" }
        created_at: { type: string, format: date-time }

    ModelRevisionList:
      type: object
      required: [endpoint_id, models]
      properties:
        endpoint_id: { type: string, format: uuid }
        models:
          type: array
          items: { $ref: "#/components/schemas/ModelRevision" }

    RegisteredModelRevision:
      type: object
      required: [model_revision_id, endpoint_id, model_id, capability_digest, capability_status, status]
      properties:
        model_revision_id: { type: string, format: uuid }
        endpoint_id: { type: string, format: uuid }
        model_id: { type: string }
        revision_label: { type: string }
        capability_digest: { type: string }
        capability_revision: { type: string }
        capability_status: { type: string, enum: [VERIFIED, UNVERIFIED, REVOKED] }
        capabilities: { $ref: "#/components/schemas/ModelCapabilities" }
        status: { type: string, enum: [ACTIVE, DISABLED] }

    Connector:
      type: object
      properties:
        id: { type: string, format: uuid }
        plugin_key: { type: string }
        name: { type: string }
        plugin_kind: { type: string }
        installation_state: { type: string, enum: [ACTIVE, UPGRADING, ROLLED_BACK, DISABLED] }
        installed_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OpsAlerts:
      type: object
      required: [dead_letter_events, failed_or_manual_runs, unknown_tool_calls, unresolved_external_operations]
      properties:
        dead_letter_events: { type: integer }
        failed_or_manual_runs: { type: integer }
        unknown_tool_calls: { type: integer }
        unresolved_external_operations: { type: integer }
        generated_at: { type: string, format: date-time }

    ReleaseDecision:
      type: object
      properties:
        id: { type: string, format: uuid }
        evaluation_run_id: { type: string, format: uuid }
        policy_revision: { type: string }
        decision: { type: string }
        reviewer_id: { type: string, nullable: true }
        decided_at: { type: string, format: date-time }
