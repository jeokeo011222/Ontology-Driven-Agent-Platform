  /api/v1/plan-templates:
    get:
      tags: [PlanTemplates]
      summary: 查询工作流模板资产
      description: |
        模板资产与执行计划**共用** planning.plans / planning.plan_revisions 两张表，
        以 plans.status = 'TEMPLATE' 为判别值区分"可复用模板"与"执行实例"。
        （本段此前断言"无 plan_templates 持久表，返回 503"，该断言在种子写入模板行
        之后已失真，见缺陷 #24。）
        返回每个模板的**最新修订**投影：name / ontology_ref 取自 plan_ir，
        node_kinds 由 plan_ir.steps[].kind 展开（对齐第十七篇 §7.3 节点词表），
        state 由修订的 validation_status 归一为大写生命周期值。
      operationId: listPlanTemplates
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 工作流模板分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanTemplateList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [PlanTemplates]
      summary: 创建工作流模板资产
      description: |
        MVP 未实现模板写入路径——模板资产当前由数据集种子
        （datasets/finance-demo/plans.json）注入，因此返回 503 并说明，
        绝不返回空列表或伪成功。
      operationId: createPlanTemplate
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "201":
          description: 已创建（写入能力落地后启用）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedResource" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

