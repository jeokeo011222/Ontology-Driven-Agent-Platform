        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/ontologies/{id}/validate:
    post:
      tags: [Ontologies]
      summary: 校验本体版本（SHACL 结构化子集）
      description: |
        **同步**执行一次真实的形状校验（不返回 202 任务引用），流程为：
        manifest 结构与闭包校验 → 投影 SHACL 形状 → 把 TBox/ABox 幂等装载进
        按 (ontology_key, version_id) 确定性派生的命名图 → 反假绿探针 →
        shacl.Validate → 落 ontology.validation_runs 与 ontology.validation_findings
        → 版本状态流转为 VALID / REJECTED（随后由 PublishOntology 的既有门禁放行）。

        两种情形一律 **422**，而不是返回一个空洞的"通过"：
        - manifest.shapes 为空——没有形状就没有可执行的约束；
        - 图中属于 sh:targetClass 的实例数为 0——此时 SHACL 按规范返回
          conforms=true，但那是"没数据可查"，不是"数据合规"（即反假绿探针）。

        未装配图存储时返回 503 并说明原因：校验必须真读图，无法在无图存储时给结论。
        当前仅执行 SHACL 子集；`checks.owl_consistent` 与 `checks.business_rules_valid`
        恒为 null，表示**该项检查未执行**（并非"执行了且不通过"）。
      operationId: validateOntology
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 校验已执行，结论见 conforms 与 version_status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OntologyValidationReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/ontologies/{id}/artifacts:
    get:
      tags: [Ontologies]
      summary: 查看本体产物（知识图谱 + RDF / OWL / SHACL 文本）
      description: |
        由最新版本的 manifest **派生**两张图与三份文本，不读图存储、也不要求先跑校验，
        因此 DRAFT 版本同样可见。产物与校验时实际装载进命名图、实际求值的形状逐条一致
        （复用同一份投影实现）。

        - `graph.ontology`：本体结构图（类 + 关系 + 实例），`graph.ontology_tbox_only`
          是它的"只含类与关系"版本（界面用「显示实例」开关在两者间切换）；
        - `graph.shapes`：形状约束图（形状 → 目标类 / 约束项）；
        - `rdf`：TBox（术语层）+ ABox（实例层）全部三元组，Turtle；
        - `shacl`：由 manifest.shapes 投影出的形状，Turtle；
        - `owl`：术语层公理（owl:Class / owl:ObjectProperty /
          owl:DatatypeProperty + rdfs:domain/range），RDF/XML。

        `manifest.shapes` 为空是正常状态：`shacl.content` 只含前缀声明、
        `graph.shapes` 是空图，界面据此显示空态，**不伪造**内容，HTTP 仍为 200。
        manifest 结构或闭包非法时返回 422，且不产出任何（半份）产物文本与图。
      operationId: getOntologyArtifacts
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: 三份产物文本
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OntologyArtifacts" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }

