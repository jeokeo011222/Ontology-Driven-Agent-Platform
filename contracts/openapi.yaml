  /api/v1/ops/alerts:
    get:
      tags: [BFF]
      summary: 运维告警视图（死信/失败运行/未知外部操作）
      operationId: opsAlerts
      responses:
        "200":
          description: 告警视图
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpsAlerts" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/releases:
    get:
      tags: [BFF]
      summary: 质量门禁决策（发布治理视图；cursor 分页 + 关键字筛选，默认 10 行/页）
      operationId: listReleases
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          required: false
          description: 关键字检索（decision / policy_revision）
          schema: { type: string }
      responses:
        "200":
          description: 发布决策列表
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ReleaseDecision" }
                  next_cursor: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        平台会话令牌，格式 `v1.<tenant_uuid>.<session_uuid>.<subject_version>`。
        会话经 identity.SessionService 校验（撤销传播 + 租户 ACTIVE）。
    sessionCookie:
      type: apiKey
      in: cookie
      name: odap_session
      description: 平台会话 Cookie（值同 bearerAuth 令牌）。
    devHeaders:
      type: apiKey
      in: header
      name: X-Odap-Dev-Tenant
      description: |
        仅开发环境（APP_ENV=development）可用：配合 X-Odap-Dev-Subject /
        X-Odap-Dev-Scopes 直接注入调试身份。生产环境禁用。

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: 单页大小（1..200，默认按资源）
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: 不透明 keyset 游标（来自上一页 next_cursor）
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 写操作幂等键（第七篇 §8.1）；回写于响应头便于核对
      schema: { type: string, maxLength: 200 }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: 乐观并发前置条件；不匹配返回 409 CONFLICT（details.current_version）
      schema: { type: string }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvIdPath:
      name: inv_id
      in: path
      required: true
      description: 工具调用记录 ID（runtime.tool_invocations.id）
      schema: { type: string, format: uuid }
    RunIdPath:
      name: id
      in: path
      required: true
      description: Run ID
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: 参数或请求体不合法
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: 身份缺失或失效
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: 授权拒绝或范围越界
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: 资源不存在或不在可见范围
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: 状态/版本/幂等冲突
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationFailed:
      description: 业务或语义校验失败
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: 限流（尊重 Retry-After）
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unavailable:
      description: 依赖不可用或能力未接入（响应体说明原因，绝不假成功）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Internal:
      description: 平台内部错误（已脱敏）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    Error:
      type: object
      required: [code, base_code, message, retryable]
      properties:
        code:
          type: string
          description: 域码（稳定、具体）
        base_code:
          type: string
          enum:
            - INVALID_ARGUMENT
            - UNAUTHENTICATED
            - PERMISSION_DENIED
            - NOT_FOUND
            - CONFLICT
            - VALIDATION_FAILED
            - RATE_LIMITED
            - UNAVAILABLE
            - RESOURCE_EXHAUSTED
            - DEADLINE_EXCEEDED
            - EXECUTION_UNKNOWN
            - INTERNAL
        message:
          type: string
          description: 脱敏后的可读信息
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true

    ErrorResponse:
      type: object
      required: [error, request_id]
      properties:
        error: { $ref: "#/components/schemas/Error" }
        request_id: { type: string }

    SessionResponse:
      type: object
      description: 注册/登录成功后返回的会话凭据（internal/api/handlers/auth_handlers.go SessionResponse）
      required: [session_token, expires_at, refresh_expires_at]
      properties:
        session_token:
          type: string
          description: 会话令牌，格式 `v1.<tenant_uuid>.<session_uuid>.<subject_version>`
        refresh_token:
          type: string
          description: 刷新令牌（仅在需要轮换时返回；不回显到审计）
        expires_at: { type: string, format: date-time }
        refresh_expires_at: { type: string, format: date-time }

    OntologyCategory:
      type: object
      description: 本体分类（ontology.categories，迁移 000021）
      required: [id, category_code, name, status]
      properties:
        id: { type: string, format: uuid }
        parent_id:
          type: string
          description: 父分类 ID；根分类为空串（DDL 允许 NULL，接口统一归一为空串）
        category_code: { type: string }
        name: { type: string }
        description: { type: string }
        sort_order: { type: integer }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        ontology_count:
          type: integer
          description: 该分类下本体的引用计数
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RunStatus:
      type: string
      description: Run 状态（contracts/01 §1，17 态，权威）
      enum:
        - CREATED
        - CONTEXT_BUILDING
        - READY
        - PLANNING
        - PLAN_VALIDATING
        - RUNNING
        - WAITING_INPUT
        - WAITING_APPROVAL
        - PAUSED
        - RECOVERING
        - CANCELLING
        - REQUIRES_RECONCILIATION
        - MANUAL_REVIEW
        - COMPLETED
        - FAILED
        - CANCELLED
        - EXPIRED

    Run:
      type: object
      description: |
        Run 的对外视图。两种驱动方式二选一：本体驱动（ontology_version 有值，
        执行规则来自本体）或 Agent 驱动（agent_version_id 有值）。
      required: [id, objective, status, subject_id, progress, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        objective:
          type: string
          description: 业务目标（本体驱动时为用户提交的自然语言目标；Agent 驱动时为空串）
        status: { $ref: "#/components/schemas/RunStatus" }
        subject_id: { type: string, format: uuid, description: 请求主体（requested_by） }
        agent_version_id: { type: string, format: uuid, nullable: true }
        ontology_version:
          type: string
          nullable: true
          description: 执行时锁定的本体版本号（人可读，如 1.0.0）；仅本体驱动时给出
        business_type: { type: string, nullable: true }
        progress: { type: number, minimum: 0, maximum: 100 }
        plan:
          type: object
          additionalProperties: true
          description: 本体审查生成的结构化执行计划（source=ontology）
        review_conclusion:
          type: object
          additionalProperties: true
          description: |
            本体审查结论：decision / reasons / conforms / rule_checks /
            shape_findings / graph_iri / ontology / facts。
            decision 由服务端合成，SHACL 判定的不合规**不可**被模型判断覆盖。
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RunList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Run" } }
        next_cursor: { type: string }

    PlanTemplateState:
      type: string
      description: |
        模板生命周期。由最新修订的 validation_status 归一而来
        （VALID→VALIDATED、INVALID→REJECTED、其余→DRAFT）。
      enum: [DRAFT, VALIDATED, REJECTED]

    PlanTemplate:
      type: object
      description: |
        工作流模板资产（planning.plans.status = 'TEMPLATE' 的行 + 其最新修订）。
        业务定义（name / ontology_ref / 步骤）存放在 plan_ir JSONB，出自数据文件
        datasets/finance-demo/plans.json，不额外落库为列。
      required: [id, name, domain, version, state, node_kinds, revision_id, updated_at]
      properties:
        id: { type: string, format: uuid, description: 即 plan_id }
        name: { type: string }
        domain: { type: string }
        version: { type: integer, description: 最新修订号（模板的不可变版本） }
        state: { $ref: "#/components/schemas/PlanTemplateState" }
        node_kinds:
          type: array
          description: 由 plan_ir.steps[].kind 展开（第十七篇 §7.3 节点词表）
          items: { type: string }
        ontology_ref:
          type: string
          nullable: true
          description: 模板锁定的本体键
        revision_id: { type: string, format: uuid, description: 最新修订 ID }
        updated_at: { type: string, format: date-time }

    PlanTemplateList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PlanTemplate" } }
        next_cursor: { type: string }

    RunStep:
      type: object
      required: [id, run_id, seq, name, kind, status]
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        seq: { type: integer, description: 步骤序号（runtime.run_steps.step_no） }
        name: { type: string, description: 步骤名称（人可读，由服务端给出） }
        kind: { type: string, description: 步骤类型（runtime.run_steps.step_type） }
        status:
          type: string
          description: Step 状态（contracts/01 §2）
          enum: [PENDING, READY, RUNNING, RETRY_WAIT, WAITING_INPUT, WAITING_APPROVAL, SUCCEEDED, FAILED, SKIPPED, CANCELLED, UNKNOWN, RECONCILING]
        rationale: { type: string, nullable: true, description: 该步骤的判断依据 }
        ontology_version: { type: string, nullable: true, description: 该步骤所用本体版本 }
        rule_refs:
          type: array
          description: 命中的形状/规则引用
          items: { type: string }
        fact_refs:
          type: array
          description: 涉及的业务事实引用（类/实例 id）
          items: { type: string }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        error_code: { type: string, nullable: true }
        error_message: { type: string, nullable: true }
        result_payload: { type: object, additionalProperties: true }

    RunStepList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RunStep" } }
        next_cursor: { type: string }

    RunDependency:
      type: object
      required: [dep_type, dep_id, dep_version, dep_digest]
      properties:
        dep_type:
          type: string
          enum: [AGENT_VERSION, ONTOLOGY_VERSION, TOOL_VERSION, POLICY_VERSION, MODEL_CONFIG, ERP_CONNECTION, ERP_MAPPING_VERSION, PLAN_TEMPLATE]
        dep_id: { type: string }
        dep_version: { type: string }
        dep_digest: { type: string }

    CreateRunRequest:
      type: object
      description: |
        两种驱动方式二选一：携带 ontology_id 时走**本体驱动审查**
        （服务端按该本体规则审查业务目标并在本次请求内给出结论，agent_version_id
        不需要）；只带 agent_version_id 时走既有 Agent 驱动路径。
      properties:
        ontology_id:
          type: string
          format: uuid
          description: 本体驱动审查所依据的本体 id（与 agent_version_id 二选一）
        objective:
          type: string
          description: 业务目标（自然语言），本体驱动时必填
        business_type: { type: string, description: 业务类型标注（可选） }
        agent_version_id: { type: string, format: uuid }
        input: { type: object, additionalProperties: true }
        priority: { type: integer, minimum: 0, maximum: 1000, default: 100 }
        max_attempts: { type: integer, minimum: 1, maximum: 10, default: 3 }
        deadline_at: { type: string, format: date-time }

    RenewLeaseRequest:
      type: object
      required: [owner]
      properties:
        owner: { type: string }
        lease_epoch: { type: integer, format: int64 }

    CreatedResource:
      type: object
      description: 通用创建响应（至少含 id）
      required: [id]
      properties:
        id: { type: string, format: uuid }
        agent_key: { type: string }
        ontology_key: { type: string }
        plugin_key: { type: string }
        tool_key: { type: string }
        skill_key: { type: string }
        policy_key: { type: string }
        version_id: { type: string, format: uuid }
        version: { type: string }
        status: { type: string }

    Agent:
      type: object
      properties:
        id: { type: string, format: uuid }
        agent_key: { type: string }
        domain: { type: string }
        description: { type: string }
        status: { type: string }
        # 内置智能体（平台自身能力，如 AI 自动生成 / 本体校验 等）为 true；
        # 内置项不可修改（PATCH/DELETE/publish 一律 409），仅用户自建 Agent 可改。
        is_builtin: { type: boolean }
        latest_version_id: { type: string, format: uuid, nullable: true }
        latest_version: { type: string, nullable: true }
        latest_version_status: { type: string, nullable: true }

    CreateAgentRequest:
      type: object
      required: [agent_key, domain, input_schema, output_schema]
      properties:
        agent_key: { type: string }
        domain: { type: string }
        description: { type: string }
        version: { type: string }
        input_schema: { type: object, additionalProperties: true }
        output_schema: { type: object, additionalProperties: true }
        skills:
          type: array
          description: |
            绑定的技能键列表（写入 dependency_manifest.skills）。fail-closed：
            任一 skill_key 不存在或没有 PUBLISHED 版本 → 404，整单拒绝。
          items: { type: string }

    Ontology:
      type: object
      properties:
        id: { type: string, format: uuid }
        ontology_key: { type: string }
        name: { type: string }
        domain: { type: string }
        granularity: { type: string }
        description: { type: string }
        status: { type: string }
        latest_version_id: { type: string, format: uuid, nullable: true }
        latest_version: { type: string, nullable: true }
        latest_version_status: { type: string, nullable: true }

    OntologyDetail:
      description: |
        `GET /api/v1/ontologies/{id}` 的响应：列表字段 + 由最新版本 manifest
        **派生**的「类与关系」+ 最近一次校验的发现项与结论。
      allOf:
        - $ref: "#/components/schemas/Ontology"
        - type: object
          required: [classes, findings]
          properties:
            classes:
              type: array
              description: 由 manifest 投影出的类与关系，随详情一起返回（页面不再自行解析清单）。
              items: { $ref: "#/components/schemas/OntologyClass" }
            findings:
              type: array
              description: 最近一次校验的发现项；无违规时为空数组，**恒为数组**。
              items: { $ref: "#/components/schemas/ShaclFinding" }
            validation:
              type: object
              nullable: true
              description: 最近一次校验结论；从未校验时为 null。
              additionalProperties: true
            manifest:
              type: object
              description: 最新版本的原始清单（留痕用；页面展示的「类与关系」是它的投影，不是它本身）。
              additionalProperties: true

    OntologyClass:
      type: object
      description: 由 manifest 投影出的一个业务类及其关系。
      required: [iri, label, relations]
      properties:
        iri: { type: string }
        label: { type: string, description: 清单未写 label 时回落到类名 }
        description: { type: string }
        relations:
          type: array
          description: 仅列出以本类为起点的关系（manifest 里关系是全局声明，按 from_class 归属到各类）。
          items:
            type: object
            required: [predicate, target, label]
            properties:
              predicate: { type: string, description: 关系谓词的 IRI }
              target: { type: string, description: 目标类的 IRI }
              label: { type: string, description: 清单未写说明时回落到关系名 }

    CreateOntologyRequest:
      type: object
      required: [ontology_key, name, domain, granularity, manifest]
      properties:
        ontology_key: { type: string }
        name: { type: string }
        domain: { type: string }
        granularity: { type: string }
        description: { type: string }
        version: { type: string }
        manifest: { type: object, additionalProperties: true }

    OntologyArtifacts:
      type: object
      description: |
        `GET /api/v1/ontologies/{id}/artifacts` 的响应：本体最新版本的三份产物文本，
        以及供界面画图的结构化节点/边。
        对应用户可见影响：抽屉中「知识图谱」页签画出的两张图（`graph.ontology` /
        `graph.shapes`），「RDF / OWL / SHACL」页签展示的原文（`rdf` / `owl` / `shacl`），
        `counts` 是页脚展示的规模信息。
      required: [ontology_id, ontology_key, version_id, version, graph_iri, rdf, owl, shacl, graph, counts]
      properties:
        ontology_id: { type: string, format: uuid }
        ontology_key: { type: string }
        version_id: { type: string, format: uuid }
        version: { type: string }
        graph_iri:
          type: string
          description: 由 (ontology_key, version_id) 确定性派生的数据命名图 IRI。
        rdf: { $ref: "#/components/schemas/OntologyArtifactText" }
        owl: { $ref: "#/components/schemas/OntologyArtifactText" }
        shacl: { $ref: "#/components/schemas/OntologyArtifactText" }
        graph:
          type: object
          description: |
            与上述三份文本同源（同一份 manifest 投影）的图结构，供界面画图。
            每个节点/边的 ID 都是词项 IRI，可在源码页签里逐条找到对应语句。
          required: [ontology, ontology_tbox_only, shapes]
          properties:
            ontology:
              $ref: "#/components/schemas/OntologyGraph"
              description: 本体结构图，含实例（ABox）。
            ontology_tbox_only:
              $ref: "#/components/schemas/OntologyGraph"
              description: |
                本体结构图，只含类与类之间的关系。两份都返回是刻意的：界面上的
                「显示实例」开关只需在两者间切换，不需要再发一次请求，也避免
                前端自己过滤导致"图上该有什么"出现第二份定义。
            shapes:
              $ref: "#/components/schemas/OntologyGraph"
              description: 形状约束图：形状 →「目标类 / 约束项」。
        counts:
          type: object
          description: 规模信息，全部取自 manifest（本端点不读图存储，故不含运行时实例计数）。
          required: [tbox_triples, abox_triples, shapes, target_classes, instances]
          properties:
            tbox_triples: { type: integer }
            abox_triples: { type: integer }
            shapes: { type: integer }
            target_classes: { type: integer }
            instances: { type: integer }

    OntologyGraph:
      type: object
      description: 一张自包含的图：节点与边。边两端的 ID 必然出现在 nodes 里。
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/OntologyGraphNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/OntologyGraphEdge" }

    OntologyGraphNode:
      type: object
      description: 图上的一个节点；ID 为词项 IRI，与源码页签里的写法一致。
      required: [id, kind, label]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [class, instance, shape, constraint]
          description: |
            class=本体里的类；instance=样例实例；shape=SHACL 形状；
            constraint=形状下的属性形状（约束项）。
        label:
          type: string
          description: 节点标题：优先中文标签，缺失时回落词项局部名。
        subtitle:
          type: string
          description: 词项局部名（与源码写法一致）；与 label 相同时省略。
        details:
          type: array
          description: 节点内的要点行（类的属性、实例的属性取值、约束项…），顺序稳定。
          items: { type: string }

    OntologyGraphEdge:
      type: object
      description: 图上的一条边。
      required: [from, to, kind, label]
      properties:
        from: { type: string }
        to: { type: string }
        kind:
          type: string
          enum: [relation, type, target, property]
          description: |
            relation=对象属性；type=实例到其类（rdf:type）；
            target=形状到目标类（sh:targetClass）；property=形状到约束项（sh:property）。
        label:
          type: string
          description: 边上的谓词简称，如 `claimType` / `sh:targetClass`。

    OntologyArtifactText:
      type: object
      description: 一份产物文本及其媒体类型。
      required: [format, content]
      properties:
        format:
          type: string
          description: 媒体类型；Turtle 为 text/turtle，OWL 为 application/rdf+xml。
        content: { type: string }

    OntologyValidationReport:
      type: object
      description: |
        `POST /api/v1/ontologies/{id}/validate` 的同步响应。
        对应用户可见影响：`version_status` 决定「发布」按钮是否可用，
        `findings[].blocking` 决定阻断项计数。
      required: [ontology_id, version_id, version_status, conforms, run_status, findings]
      properties:
        ontology_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        version: { type: string }
        version_status:
          type: string
          enum: [DRAFT, VALIDATING, VALID, REJECTED]
          description: 本体版本在状态机中的新位置；只有 VALID/APPROVED 才可发布。
        conforms:
          type: boolean
          description: SHACL 结论。false 时 findings 中必有至少一条 blocking=true。
        validation_run_id: { type: string, format: uuid }
        run_status:
          type: string
          enum: [PASSED, FAILED]
          description: ontology.validation_runs.status —— 本次校验运行的结论。
        validator_version: { type: string }
        findings:
          type: array
          description: 恒为数组（无违规时为空数组，不省略该字段）。
          items: { $ref: "#/components/schemas/ShaclFinding" }
        graph:
          type: object
          description: 本次校验的数据面证据（用于人工核对"到底查了多少数据"）。
          properties:
            graph_iri: { type: string }
            target_classes: { type: array, items: { type: string } }
            focus_nodes: { type: integer, description: 命中目标类的实例数；为 0 时端点返回 422。 }
            tbox_triples: { type: integer }
            abox_triples: { type: integer }
        checks:
          type: object
          description: 各检查项的结论；null 表示该项**未执行**。
          properties:
            syntax_valid: { type: boolean }
            shacl_conformant: { type: boolean }
            owl_consistent: { type: boolean, nullable: true }
            business_rules_valid: { type: boolean, nullable: true }

    ShaclFinding:
      type: object
      description: 一条校验发现项（ontology.validation_findings 的对外投影）。
      required: [id, severity, message, blocking]
      properties:
        id: { type: string, format: uuid }
        severity:
          type: string
          enum: [info, warning, violation]
          description: |
            由库内 INFO/WARNING/ERROR/CRITICAL 映射而来；任何未登记取值一律
            映射为 violation（fail-closed），避免未知级别被当作不阻断。
        level: { type: string, description: 中文级别标签（提示/警告/违规）。 }
        message: { type: string }
        code:
          type: string
          description: 稳定的机器可读代码（SHACL 组件名，如 MinCount / Pattern / Datatype）。
        focus_node: { type: string, description: 违规实例的 IRI；针对整个类的约束时省略该字段。 }
        path: { type: string, description: 违规属性的谓词 IRI；无具体路径时省略该字段。 }
        blocking: { type: boolean, description: severity=violation 时为 true，即阻断发布。 }
        finding_digest:
          type: string
          description: |
            发现项的跨轮次稳定身份（SHA-256 hex）。id 是随机 UUID、validation_run_id
            每轮都变，唯有该摘要在轮次之间保持稳定，因此"上轮 3 条违规、本轮剩 2 条"这类
            回归对比只能依赖它。元组为 shape_id‖focus_node‖path‖component‖severity，
            不含 message（改措辞不等于问题变了）。迁移前写入的旧行无形状身份、无法复算，
            摘要为空，此时省略该字段。

