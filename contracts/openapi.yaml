      description: |
        integration.erp_systems 为全局字典：系统编码 / 显示名 / 适配器键 /
        是否已实现适配器 / 是否默认。未实现适配器的类型（如金蝶星空云 / SAP）
        在前端明确标注，创建连接时会被拒绝（fail-closed）。
      operationId: listErpSystems
      responses:
        "200":
          description: ERP 系统字典
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ErpSystem" }
                  next_cursor: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/admin/erp-connections:
    get:
      tags: [ERP]
      summary: 查询租户级 ERP 连接（cursor 分页 + 状态/系统/关键字筛选，默认 10 行/页）
      operationId: listErpConnections
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [ACTIVE, DISABLED, DELETED] }
        - name: system_code
          in: query
          required: false
          schema: { type: string }
        - name: q
          in: query
          required: false
          description: 关键字检索（连接名 / base_url）
          schema: { type: string }
      responses:
        "200":
          description: 连接列表
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ErpConnection" }
                  next_cursor: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [ERP]
      summary: 新建 ERP 连接（凭据密文优先落库）
      description: |
        凭据双路径且密文优先：`credential` 以 AES-256-GCM 信封加密后落库；
        未提供 `credential` 时回落 `credential_ref` 环境变量引用；明文绝不回显
        （读取仅回打码值）。未实现适配器的 `system_code` 一律拒绝。
      operationId: createErpConnection
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ErpConnectionInput" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErpConnection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/admin/erp-connections/test:
    post:
      tags: [ERP]
      summary: 连接测试（用录入参数直连真实探针，不入库、不产生业务写入）
      operationId: testErpConnection
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
