                ontology_key: { type: string }
                name: { type: string }
                domain: { type: string, description: "业务领域；恒等于所选业务领域分类的 category_code" }
                granularity: { type: string, description: "如 DOMAIN/ENTITY" }
                description: { type: string }
                category_id: { type: string, format: uuid }
                model_id: { type: string, description: "指定模型；留空则按能力择优" }
