            data_freshness:
              type: string
              description: 最近一条审计事件的 occurrence 时间（RFC3339）；无数据时为"无数据"
            semantic_regressions: { type: integer }
        governance:
          type: object
          properties:
            recent_policy_changes: { type: integer, description: 最近 30 天创建的策略版本数 }
            failed_gates: { type: integer, description: decision ∈ {FAILED,REJECTED,BLOCKED} }
            open_security_alerts: { type: integer, description: 最近 24 小时 outcome ∈ {DENIED,REJECTED} 的审计事件数 }
            pending_releases: { type: integer, description: decision = PENDING 的门禁决策数 }

