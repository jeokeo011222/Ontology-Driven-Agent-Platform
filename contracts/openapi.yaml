        - name: action
          in: query
          required: false
          schema: { type: string }
        - name: event_type
          in: query
          required: false
          schema: { type: string }
        - name: outcome
          in: query
          required: false
          description: |
            按事件结论等值过滤（自由文本，不枚举校验）。实际写入的取值包括
            SUCCESS（执行成功）、DENIED（被拒绝/未授权）、REJECTED（被驳回）、
            ERROR（执行报错）。
